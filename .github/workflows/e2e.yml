name: E2E

# Browser e2e (Playwright) — TM-134. Runs on the long-lived branch + manual dispatch ONLY, never
# on the PR gate: it's slow (real browser, full stack + Firebase Auth emulator) and would blow up
# PR latency. The fast PR gate stays in ci.yml. Keep this trigger list exactly as below.
on:
  # Nightly + on demand, NOT per-merge (TM-153). The browser suite is slow (real browser + full
  # stack + Auth emulator) and doesn't need to gate every merge — the fast PR gate (ci.yml) does
  # that. Run it once a night, and manually whenever (e.g. before a release/sprint-end deploy).
  schedule:
    - cron: '0 3 * * *'   # ~03:00 UTC nightly
  workflow_dispatch:
    inputs:
      evidence_ticket:
        description: "Jira ticket key to attach screenshot evidence to (e.g. TM-190). Blank = skip."
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # TM-1178 — tier the e2e by change surface (part A): on a MANUALLY-DISPATCHED branch run, skip the
  # (slow) browser suite entirely when the branch touches no web/ files. A backend/infra/android/docs
  # -only branch can't be exercised by Playwright at all, so running it is ~18 min of wasted signal
  # (wave-admin-events-3's backend chain burned ~4 full runs for zero browser-relevant reds). The
  # NIGHTLY cron (and any non-dispatch trigger) always runs the FULL suite — it's the coverage
  # backstop, so scoping the per-branch dispatch is safe. Fail SAFE: on any diff uncertainty we RUN
  # e2e rather than skip a real web change (mirrors ci.yml's "Detect non-docs changes" filter).
  changes:
    name: Detect web-surface changes (TM-1178)
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      # TM-1180: the Playwright --grep for a surface-scoped run. Empty = run the FULL suite (nightly,
      # any shared-core/unknown change, or a diff we couldn't resolve). Consumed by the e2e job below.
      grep: ${{ steps.scope.outputs.grep }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff the dispatched branch against main

      - name: Determine whether any web/ file changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Only a manual branch dispatch is scoped. The nightly cron (and anything else) always runs
          # the full matrix — it is the daily backstop that guarantees complete coverage.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Event=$EVENT (not a branch dispatch) → run the FULL e2e (nightly/backstop)."
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags origin main 2>/dev/null || true
          RANGE="origin/main...HEAD"
          echo "diff range: $RANGE"
          if ! FILES="$(git diff --name-only $RANGE 2>/dev/null)"; then
            echo "diff failed → run FULL e2e (fail-safe)."; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files vs main:"; printf '%s\n' "$FILES"
          if [ -z "$FILES" ]; then
            echo "No files vs main → run FULL e2e (fail-safe)."; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # "Web surface" = anything under web/ — the app code (web/src), the e2e specs+config
          # (web/e2e), and public assets (web/public). Everything else (backend/, infra/, android/,
          # .github/, docs, *.md, root config) is invisible to the browser suite.
          WEB="$(printf '%s\n' "$FILES" | grep -E '^web/' || true)"
          if [ -n "$WEB" ]; then
            echo "Web-surface change → RUN e2e. Triggering files:"; printf '%s\n' "$WEB"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "e2e: **running** — web-surface change detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No web/ change (backend/infra/docs only) → SKIP the browser e2e (TM-1178)."
            echo "web=false" >> "$GITHUB_OUTPUT"
            {
              echo "### e2e skipped (TM-1178)"
              echo "This branch changes no \`web/\` files, so the Playwright suite can't exercise it."
              echo "The backend suite (ci.yml) covers it; the nightly full run is the coverage backstop."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # TM-1180: for a web-surface branch dispatch, scope the run to the specs the change can affect
      # (scope-e2e.mjs maps changed web/src files → surface @tags → a Playwright --grep). Any shared-core
      # file, any non-web/src web change, or any unmapped path degrades to the FULL suite (empty grep).
      # The nightly cron (and any non-dispatch) always runs FULL — grep stays empty. scope-e2e.mjs is
      # dependency-free (node: builtins only), so the runner's preinstalled Node runs it without setup.
      - name: Compute the surface-scoped grep (TM-1180)
        id: scope
        if: ${{ steps.filter.outputs.web == 'true' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Non-dispatch (nightly/backstop) → FULL suite."; echo "grep=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES="$(git diff --name-only origin/main...HEAD 2>/dev/null || true)"
          if [ -z "$FILES" ]; then
            echo "No diff resolved → FULL suite (fail-safe)."; echo "grep=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GREP="$(printf '%s\n' "$FILES" | node web/e2e/scope-e2e.mjs)" || GREP="FULL"
          if [ "$GREP" = "FULL" ] || [ -z "$GREP" ]; then
            echo "Scope → FULL suite."; echo "grep=" >> "$GITHUB_OUTPUT"
            echo "### e2e: full suite (shared-core / unmapped change)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scope → --grep '$GREP'"; echo "grep=$GREP" >> "$GITHUB_OUTPUT"
            { echo "### e2e scoped (TM-1180)"; echo "Running only: \`--grep '$GREP'\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: Browser walkthrough (Playwright)
    needs: changes
    # TM-1178: run only when the changes guard says a web-surface file changed (always true on the
    # nightly cron). A skipped e2e still leaves the run green — a no-web-diff dispatch passes fast.
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teammarhaba
          POSTGRES_USER: app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d teammarhaba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DB (matches the postgres service above).
      DB_NAME: teammarhaba
      DB_USER: app
      DB_PASSWORD: devpassword
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      # Firebase Auth emulator — both the backend (Admin SDK) and the browser talk to it on the host.
      FIREBASE_PROJECT_ID: teammarhaba
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      # Firebase Storage emulator (TM-166) — the browser uploads avatars to it.
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      # Where the e2e harness finds the backend + points the web app's injected config.
      E2E_API_BASE_URL: http://127.0.0.1:8080
      E2E_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      E2E_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      # TM-759: the webhook signing secret the Playwright process (membership-webhook.mjs) signs the injected
      # settle webhook with. MUST equal the backend's REVOLUT_WEBHOOK_SIGNING_SECRET (set on the backend
      # step) so the HMAC verifies — else the injected webhook is rejected 401 and no order settles. DUMMY
      # test-only value; NOT a real Revolut secret.
      E2E_REVOLUT_WEBHOOK_SIGNING_SECRET: e2e-revolut-webhook-signing-secret

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin) + Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Install e2e dependencies
        working-directory: web/e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (Chromium)
        working-directory: web/e2e
        run: npx playwright install --with-deps chromium

      # TM-1179: every spec must carry a product-surface @tag (on the test or an enclosing describe) so
      # surface-scoped e2e (--grep, TM-1180) can't silently drop an untagged test. Runs here (Playwright
      # is installed, no backend/emulator needed) so a new untagged spec fails the suite before it runs.
      - name: Assert every e2e spec carries a surface tag (TM-1179)
        working-directory: web/e2e
        run: npm run lint:tags

      # TM-1180: unit-test the surface-scoping resolver (scope-e2e.mjs) before the browser suite — a
      # broken map/resolver would silently under-scope a scoped run, so it must fail fast here. Pure
      # node:test logic, no browser/emulator needed.
      - name: Test the e2e surface-scoping resolver (TM-1180)
        working-directory: web/e2e
        run: npm run test:scope

      - name: Start Firebase Auth + Storage emulators
        working-directory: web/e2e
        # The Storage emulator (TM-166) loads the repo-root storage.rules via the root firebase.json
        # (passed with --config, since the Firebase CLI won't reference a rules file outside the
        # config's own directory), so the avatar walkthrough exercises the real owner/type/size rules.
        run: |
          npx firebase emulators:start --only auth,storage --project teammarhaba --config ../../firebase.json > /tmp/firebase-emulator.log 2>&1 &
          echo "Waiting for the Auth emulator on :9099…"
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:9099/" > /dev/null && { echo "auth emulator up"; break; }
            sleep 2
          done
          echo "Waiting for the Storage emulator on :9199…"
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:9199/" > /dev/null && { echo "storage emulator up"; break; }
            sleep 2
          done

      # TM-704: verify the Storage RULES themselves — an admin can upload to event-images/ &
      # venue-images/ and non-admins/anonymous can't. Reuses the emulator started above (loaded with
      # the committed storage.rules). The Playwright specs can't cover this: events.spec.mjs sets
      # imagePath via the API (TM-392 is API-only), so no bytes ever exercise those rule paths.
      - name: Verify Storage rules (event/venue image uploads — TM-704)
        working-directory: web/e2e
        run: node tests/storage-rules.mjs

      # TM-759: a LOOPBACK Revolut Merchant-API stub the e2e backend's REVOLUT_API_BASE points at, so the
      # membership PAY + Subscribe specs (paid-rsvp / subscribe, TM-738) can drive the REAL provider's
      # create-order / create-customer calls with no reachable sandbox. Started BEFORE the backend so the
      # base URL is answerable the moment a checkout fires. Same background-process + curl-readiness shape
      # as the emulator/backend steps above.
      - name: Start Revolut stub (loopback Merchant API — TM-759)
        working-directory: web/e2e
        run: |
          node revolut-stub.mjs > /tmp/revolut-stub.log 2>&1 &
          echo "Waiting for the Revolut stub on :9210…"
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:9210/health" > /dev/null && { echo "revolut stub up"; break; }
            sleep 1
          done
          curl -sf "http://127.0.0.1:9210/health" > /dev/null || { echo "revolut stub failed to start"; cat /tmp/revolut-stub.log; exit 1; }

      - name: Start backend (pointed at the emulator + Postgres)
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/teammarhaba
          SPRING_DATASOURCE_USERNAME: app
          SPRING_DATASOURCE_PASSWORD: devpassword
          # TM-759: turn the membership money paths ON server-side so the checkout/subscribe endpoints are
          # reachable (default OFF → CheckoutService throws AccessDeniedException(PAYMENTS_OFF) = 403, the
          # exact CI failure the payment specs hit). The e2e backend runs SPRING_PROFILES_ACTIVE=dev, so it
          # does NOT inherit the prod deploy's hardcoded MEMBERSHIP_ENABLED — it must be set here.
          MEMBERSHIP_ENABLED: "true"
          # Keep the renewal scheduler bean OFF (it needs BOTH flags true). The specs drive the INITIAL
          # charge by injected webhook; no background renewal must fire mid-suite.
          SUBSCRIPTIONS_ENABLED: "false"
          # Point the REAL RevolutPaymentProvider at the loopback stub started above (default is the real
          # sandbox base, unreachable in CI). All outbound Merchant-API calls land on 127.0.0.1:9210.
          REVOLUT_API_BASE: http://127.0.0.1:9210
          # Any NON-BLANK secret — authorisedRequest() refuses to send an unauthenticated create-order when
          # this is blank (throws before any HTTP call). DUMMY test-only value; the stub does not validate it.
          REVOLUT_SECRET_KEY: sk_e2e_stub_secret
          # The webhook signing secret. MUST match what membership-webhook.mjs signs the injected settle
          # webhook with — the job-level E2E_REVOLUT_WEBHOOK_SIGNING_SECRET is set to this SAME value so the
          # HMAC the spec computes and the one the backend recomputes agree (else every webhook → 401).
          # DUMMY test-only value.
          REVOLUT_WEBHOOK_SIGNING_SECRET: e2e-revolut-webhook-signing-secret
          # Disable the per-client API rate limiter (TM-158) for the browser-e2e backend (TM-595). The
          # limiter defaults to 120 req/min PER CLIENT, keyed by uid. The browser suite is a synthetic
          # load, not a real user: EVERY admin spec (admin-walkthrough, broadcast-admin, theme-visual,
          # admin-events, …) signs in as the ONE seeded `e2e-admin` uid, so they all share a single
          # bucket, and each authenticated page-load bursts several parallel /me + badge + unread-total
          # calls on auth-resolve. Cumulatively that blows the 120/min budget — the tests running LAST
          # (mobile admin-events) then get a 429 on the edit-PATCH / list-reload and fail. This mirrors
          # exactly what application-test.yml already does for the integration suite (rate-limit off so
          # the shared MockMvc client isn't throttled); the limiter itself keeps its own dedicated
          # coverage in RateLimitFilterIntegrationTest, so nothing is lost by exempting the UI journeys.
          API_RATE_LIMIT_ENABLED: "false"
          # Events e2e (TM-400): run the waitlist offer-cascade sweep (TM-397) on a FAST cadence so the
          # "un-RSVP → a freed spot is offered → claim" path lands within seconds instead of the ~60s
          # prod default. The events spec still polls (bounded) for the claim affordance, so this only
          # tightens the timing; it never makes the run depend on an exact interval.
          OFFER_CASCADE_SCAN_INTERVAL_MS: "3000"
          OFFER_CASCADE_INITIAL_DELAY_MS: "2000"
        run: |
          java -jar backend/target/*.jar > /tmp/backend.log 2>&1 &
          echo "Waiting for the backend on :8080…"
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:8080/health" > /dev/null && { echo "backend up"; break; }
            sleep 2
          done
          curl -sf "http://127.0.0.1:8080/health" > /dev/null || { echo "backend failed to start"; tail -n 100 /tmp/backend.log; exit 1; }

      # TM-1180: run the surface-scoped subset when the changes job resolved a grep; otherwise the FULL
      # suite (nightly, shared-core/unmapped change, or a diff we couldn't resolve → empty grep). --grep
      # applies across BOTH projects, so mobile-chromium stays in scoped per-PR runs (cheap once scoped).
      - name: Run Playwright walkthrough
        working-directory: web/e2e
        env:
          E2E_GREP: ${{ needs.changes.outputs.grep }}
        run: |
          if [ -n "$E2E_GREP" ]; then
            echo "Scoped run (TM-1180): --grep '$E2E_GREP'"
            npx playwright test --grep "$E2E_GREP"
          else
            echo "Full run."
            npm test
          fi

      - name: Upload Playwright report + screenshots (always — evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          if-no-files-found: warn

      # Best-effort, non-fatal: attach the run's screenshots/report to a Jira ticket when the run was
      # dispatched with an `evidence_ticket` (e.g. the sprint test ticket TM-190). Skips silently if
      # no ticket was given or the JIRA_* secrets aren't set — never fails the e2e job.
      - name: Post screenshot evidence to the Jira ticket (best-effort)
        if: ${{ always() && github.event.inputs.evidence_ticket != '' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.evidence_ticket }}
        run: |
          set -o pipefail
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::warning::Jira secrets not set — skipping evidence post for $TICKET."; exit 0
          fi
          if [ ! -d web/e2e/playwright-report ] && [ ! -d web/e2e/test-results ]; then
            echo "::warning::no Playwright report/screenshots found — nothing to post."; exit 0
          fi
          # Evidence = the INDIVIDUAL viewable screenshots (never zip-only — a reviewer must not have to
          # download + unzip to see them) PLUS the full zip bundle (report + traces). Attach BOTH, but
          # in BATCHES: a single multipart request with every file is rejected 413 (Payload Too Large),
          # so cap each POST at a handful of files.
          ZIP="/tmp/playwright-evidence-${GITHUB_RUN_ID}.zip"
          ( cd web/e2e && zip -qr "$ZIP" playwright-report test-results ) || true
          ATT="$JIRA_BASE_URL/rest/api/3/issue/$TICKET/attachments"
          post() { # POST the given -F args; echo the HTTP code (never throws)
            curl -sS -o /tmp/jira-att.txt -w '%{http_code}' \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" -H "X-Atlassian-Token: no-check" "$@" "$ATT" || echo "000"
          }
          ok=0; bad=0; batch=(); n=0
          flush() {
            [ ${#batch[@]} -eq 0 ] && return 0
            c="$(post "${batch[@]}")"
            case "$c" in
              200|201) ok=$((ok + ${#batch[@]})) ;;
              *) bad=$((bad + ${#batch[@]})); echo "::warning::screenshot batch failed (HTTP $c): $(head -c 200 /tmp/jira-att.txt 2>/dev/null)" ;;
            esac
            batch=()
          }
          # 1) individual PNGs, 15 per request to stay under the per-request size cap.
          while IFS= read -r png; do
            batch+=(-F "file=@${png}"); n=$((n + 1))
            [ $(( n % 15 )) -eq 0 ] && flush
          done < <(find web/e2e/test-results web/e2e/playwright-report -type f -name '*.png' 2>/dev/null | sort)
          flush
          # 2) the full zip bundle, on its own request.
          if [ -f "$ZIP" ]; then
            c="$(post -F "file=@${ZIP}")"
            case "$c" in 200|201) : ;; *) echo "::warning::zip attach failed (HTTP $c)" ;; esac
          fi
          echo "Posted $ok individual screenshot(s) to $TICKET ($bad failed) + the evidence zip."
          exit 0

      - name: Upload service logs (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            /tmp/backend.log
            /tmp/firebase-emulator.log
            /tmp/revolut-stub.log
          if-no-files-found: warn
